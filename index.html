<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>忍者の分身 抽選</title>
<style>
:root{
  --bg:#050505;--panel:#151515;--line:#3d3425;--gold:#e5b95e;
  --text:#fff;--muted:#bdb7ab;--danger:#a53b31;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#242018 0,#090909 42%,#000 100%);color:var(--text);font-family:"Yu Mincho","Hiragino Mincho ProN","Yu Gothic","Hiragino Kaku Gothic ProN",serif}
body{min-height:100vh;overflow-x:hidden}
button,select,textarea,input{font:inherit}
button{cursor:pointer}
.app{width:min(1400px,100%);margin:auto;padding:18px 16px 32px}
.header{text-align:center;margin-bottom:14px}
.title{font-size:clamp(30px,5vw,64px);margin:0;letter-spacing:.1em;text-shadow:0 3px 0 #000,0 0 18px rgba(229,185,94,.35)}
.subtitle{color:var(--gold);font-size:clamp(13px,2vw,20px);letter-spacing:.22em;margin-top:4px}
.setup{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:16px;align-items:start}
.panel{background:rgba(18,18,18,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 35px #0008;padding:16px}
.panel h2{margin:0 0 10px;font-size:20px}
.help{color:var(--muted);font-size:13px;line-height:1.7}
textarea{width:100%;height:250px;resize:vertical;background:#070707;color:#fff;border:1px solid #544830;border-radius:10px;padding:12px;line-height:1.55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.count{margin-left:auto;color:var(--gold);font-weight:700}
select,button{border:1px solid #65573c;border-radius:9px;background:#242018;color:#fff;padding:10px 13px}
button.primary{background:linear-gradient(#c89c45,#8d5e18);border-color:#f0ca7e;color:#100b04;font-weight:800}
button.danger{background:#3a1512;border-color:#8d453d}
button:disabled{opacity:.45;cursor:not-allowed}
.stage-panel{min-height:470px}
.stage-toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.stage{position:relative;min-height:390px;border-radius:14px;border:1px solid #403727;background:radial-gradient(circle at center,#251f16 0,#0b0b0b 52%,#020202 100%);overflow:hidden;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px;align-content:start}
.card{position:relative;min-width:0;background:linear-gradient(180deg,#211d17,#0a0a0a);border:1px solid #51442e;border-radius:11px;padding:6px 5px 7px;text-align:center;transition:transform .4s,opacity .6s,filter .6s}
.card img{width:100%;height:88px;object-fit:contain;display:block;filter:drop-shadow(0 5px 4px #000)}
.card .fallback{height:88px;display:none;align-items:center;justify-content:center;font-size:58px}
.card .num{font-weight:800;color:var(--gold);font-size:13px;white-space:nowrap}
.card .name{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.eliminating{animation:shake .28s linear 3}
.card.gone{opacity:0;transform:scale(.25) rotate(13deg);filter:blur(7px);pointer-events:none}
/* 10人になるまでは .gone をDOMに残すので、空いた場所は詰まらない */
.smoke{position:absolute;inset:0;display:none;place-items:center;pointer-events:none;font-size:70px;filter:drop-shadow(0 0 10px #fff)}
.card.eliminating .smoke{display:grid;animation:smoke .8s ease-out forwards}
.status{text-align:center;margin-top:10px;min-height:30px;font-size:clamp(18px,2.4vw,30px);font-weight:800;color:var(--gold)}

/* 残り10人以下：生存者だけを詰め、ステージいっぱいに拡大 */
.grid.finalists{
  width:100%;
  height:100%;
  align-content:stretch;
  justify-content:stretch;
  gap:clamp(8px,1.1vw,16px);
}
.grid.finalists .card{
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:0;
  padding:clamp(6px,1vw,12px);
  border-width:2px;
  box-shadow:0 0 20px #000a;
}
.grid.finalists .card img,
.grid.finalists .card .fallback{
  width:100%;
  height:var(--final-img-height,180px);
  max-height:none;
  object-fit:contain;
  flex:1 1 auto;
}
.grid.finalists .card .num{font-size:var(--final-num-size,22px)}
.grid.finalists .card .name{font-size:var(--final-name-size,24px);white-space:normal;line-height:1.12}

.winner-overlay{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(0,0,0,.82);padding:20px}
.winner-overlay.show{display:grid;animation:fade .3s}
.winner-box{width:min(640px,95vw);text-align:center;background:radial-gradient(circle,#392a13,#080808 66%);border:2px solid var(--gold);border-radius:24px;padding:24px;box-shadow:0 0 70px #dca94066}
.winner-label{font-size:clamp(22px,4vw,42px);color:var(--gold);letter-spacing:.18em}
.winner-name{font-size:clamp(38px,8vw,86px);font-weight:900;margin:12px 0}
.winner-num{font-size:clamp(22px,4vw,38px)}
.recording .setup .panel:first-child,.recording .header,.recording .stage-toolbar .non-record,.recording footer{display:none!important}
.recording .setup{display:block}
.recording .stage-panel{border:0;background:transparent;box-shadow:none;padding:0;min-height:100vh}
.recording .stage{border:0;border-radius:0;min-height:calc(100vh - 58px);padding:8px}
.recording .grid{grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:5px}
.recording .card{padding:3px}
.recording .card img,.recording .card .fallback{height:clamp(50px,10vh,100px)}
.recording .card .num{font-size:clamp(10px,1.4vw,14px)}
.recording .card .name{font-size:clamp(10px,1.45vw,15px)}
.record-exit{display:none!important}
.recording .record-exit{display:inline-block!important;position:fixed;right:10px;top:10px;z-index:40;opacity:.28}
.recording .record-exit:hover{opacity:1}
footer{text-align:center;color:#7d776c;font-size:12px;margin-top:14px}
@keyframes shake{25%{transform:translateX(-4px) rotate(-2deg)}75%{transform:translateX(4px) rotate(2deg)}}
@keyframes smoke{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:800px){
 .app{padding:10px 8px 18px}.setup{grid-template-columns:1fr}.stage-panel{min-height:420px}
 textarea{height:190px}.grid{grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px}
 .card img,.card .fallback{height:70px}.card .name{font-size:12px}.card .num{font-size:11px}
}

/* 録画モード：全参加者を1画面内に表示 */
.record-only{display:none!important}
body.recording{height:100vh!important;overflow:hidden!important}
body.recording .app{width:100%!important;height:100vh!important;padding:0!important;margin:0!important;overflow:hidden!important}
body.recording .header,
body.recording .setup>.panel:first-child,
body.recording footer{display:none!important}
body.recording .setup{display:block!important;height:100vh!important}
body.recording .stage-panel{display:flex!important;flex-direction:column!important;height:100vh!important;min-height:0!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;overflow:hidden!important}
body.recording .stage-toolbar{order:2!important;flex:0 0 58px!important;height:58px!important;margin:0!important;padding:7px 8px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;background:linear-gradient(transparent,rgba(0,0,0,.92) 30%)!important;z-index:25!important}
body.recording .stage-toolbar .non-record{display:none!important}
body.recording .stage-toolbar .record-only{display:inline-block!important}
body.recording #recordBtn{display:none!important}
body.recording #pauseBtn.record-only{display:inline-block!important}
body.recording .stage{order:1!important;flex:1 1 auto!important;width:100%!important;height:auto!important;min-height:0!important;padding:4px!important;border:0!important;border-radius:0!important;overflow:hidden!important}
body.recording .grid{width:100%!important;height:100%!important;gap:3px!important;align-content:stretch!important;overflow:hidden!important}
body.recording .card{min-width:0!important;min-height:0!important;padding:2px!important;border-radius:5px!important;overflow:hidden!important;display:flex!important;flex-direction:column!important;justify-content:center!important}
body.recording .card img,body.recording .card .fallback{width:100%!important;height:var(--record-img-height,40px)!important;min-height:0!important;flex:1 1 auto!important;object-fit:contain!important}
body.recording .card .num{font-size:var(--record-num-size,9px)!important;line-height:1.05!important}
body.recording .card .name{font-size:var(--record-name-size,9px)!important;line-height:1.05!important}
body.recording .status{display:none!important}
.record-exit{display:none!important}
body.recording .record-exit{display:inline-block!important;position:fixed!important;right:6px!important;top:6px!important;z-index:50!important;opacity:.25!important;padding:5px 8px!important;font-size:10px!important}
body.recording .record-exit:hover{opacity:1!important}

/* 録画モードでも残り10人以下は大きく表示 */
body.recording .grid.finalists{
  gap:clamp(5px,.8vw,12px)!important;
}
body.recording .grid.finalists .card img,
body.recording .grid.finalists .card .fallback{
  height:var(--final-img-height,180px)!important;
}
body.recording .grid.finalists .card .num{font-size:var(--final-num-size,22px)!important}
body.recording .grid.finalists .card .name{font-size:var(--final-name-size,24px)!important}

/* スマホの全画面・録画画面でも上下に操作余白を確保 */
body.recording .app{
  padding-top:max(32px, env(safe-area-inset-top))!important;
  padding-bottom:max(40px, env(safe-area-inset-bottom))!important;
}
body.recording .setup{
  height:calc(100vh - max(32px, env(safe-area-inset-top)) - max(40px, env(safe-area-inset-bottom)))!important;
  height:calc(100dvh - max(32px, env(safe-area-inset-top)) - max(40px, env(safe-area-inset-bottom)))!important;
}
body.recording .stage-panel{
  height:100%!important;
}
body.recording .stage-toolbar{
  flex:0 0 64px!important;
  height:64px!important;
  padding:8px 10px!important;
  margin-top:4px!important;
  margin-bottom:2px!important;
}
body.recording .stage-toolbar button{
  padding:9px 11px!important;
  font-size:clamp(12px,3.2vw,16px)!important;
}
@media(max-width:600px){
  body.recording .app{
    padding-top:max(42px, env(safe-area-inset-top))!important;
    padding-bottom:max(54px, env(safe-area-inset-bottom))!important;
  }
  body.recording .setup{
    height:calc(100vh - max(42px, env(safe-area-inset-top)) - max(54px, env(safe-area-inset-bottom)))!important;
    height:calc(100dvh - max(42px, env(safe-area-inset-top)) - max(54px, env(safe-area-inset-bottom)))!important;
  }
  body.recording .stage-toolbar{
    flex:0 0 78px!important;
    height:78px!important;
    padding-top:12px!important;
    padding-bottom:12px!important;
  }
}

</style>
</head>
<body>
<button id="exitRecord" class="record-exit" style="display:none!important">録画モード終了</button>
<div class="app">
<header class="header">
  <h1 class="title">本物の忍者は誰だ！？</h1>
  <div class="subtitle">忍者の分身 抽選</div>
</header>
<div class="setup">
<section class="panel">
  <h2>参加者入力（最大80名）</h2>
  <div class="help">1行につき「忍番号,名前」。Excelの2列貼り付け（タブ区切り）にも対応。41〜50忍は猿、62〜65忍は旅猫、それ以外は忍者で表示します。</div>
  <textarea id="input" placeholder="1,ヨッシー&#10;2,やまだ"></textarea>
  <div class="row">
    <button id="clearBtn">クリア</button>
    <button id="sampleBtn">サンプル</button>
    <span class="count" id="count">0名</span>
  </div>
  <div class="row">
    <label>決定まで
      <select id="duration">
        <option value="8">8秒</option>
        <option value="12" selected>12秒</option>
        <option value="15">15秒</option>
        <option value="20">20秒</option>
        <option value="30">30秒</option>
      </select>
    </label>
    <button id="startBtn" class="primary">抽選を開始する</button>
  </div>
</section>
<section class="panel stage-panel">
  <div class="stage-toolbar">
    <button id="recordBtn" class="primary">📹 録画用画面</button>
    <button id="recordStartBtn" class="primary record-only">▶ 抽選を開始する</button>
    <button id="recordBackBtn" class="record-only">← 通常画面に戻る</button>
    <button id="pauseBtn" class="non-record record-only" disabled>一時停止</button>
    <button id="resetBtn" class="danger non-record">リセット</button>
    <button id="fullscreenBtn" class="non-record">全画面</button>
  </div>
  <div class="stage" id="stage">
    <div class="grid" id="grid"></div>
  </div>
  <div class="status" id="status">参加者を入力してください</div>
</section>
</div>
<footer>最大80名対応・録画モード搭載</footer>
</div>
<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-box">
    <div class="winner-label">当選者</div>
    <div class="winner-name" id="winnerName">---</div>
    <div class="winner-num" id="winnerNum">---</div>
    <div class="row" style="justify-content:center;margin-top:18px">
      <button id="closeWinner" class="primary">閉じる</button>
    </div>
  </div>
</div>

let participants=[], active=[], timer=null, running=false, paused=false, endAt=0, nextAt=0, baseInterval=0;
let finalMode=false;

function parse(){
 const lines=input.value.replace(/\r/g,"").split("\n").map(v=>v.trim()).filter(Boolean);
 const out=[], seen=new Set();
 for(const line of lines){
   let parts=line.includes("\t")?line.split("\t"):line.split(",");
   if(parts.length<2) continue;
   const num=parseInt(String(parts.shift()).replace(/[^\d]/g,""),10);
   const name=parts.join(",").trim();
   if(!Number.isFinite(num)||!name) continue;
   const key=num+"|"+name;
   if(!seen.has(key)){seen.add(key);out.push({num,name});}
   if(out.length>=80) break;
 }
 return out;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function updateCount(){
 const n=parse().length; count.textContent=n+"名";
 if(!running) renderPreview();
}
function cardHTML(p){
 const monkey=p.num>=41&&p.num<=50;
 const tabineko=p.num>=62&&p.num<=65;
 const img=tabineko?TABINEKO_IMG:(monkey?MONKEY_IMG:NINJA_IMG);
 const alt=tabineko?"旅猫":(monkey?"猿":"忍者");
 const fallback=tabineko?"🐈":(monkey?"🐒":"🥷");
 return `<div class="card" data-id="${p.id}">
   <img src="${img}" alt="${alt}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
   <div class="fallback">${fallback}</div>
   <div class="smoke">☁️</div>
   <div class="num">${p.num}忍</div><div class="name" title="${esc(p.name)}">${esc(p.name)}</div>
 </div>`;
}

function render(list, finalists=false){
 grid.classList.toggle("finalists",finalists);
 grid.innerHTML=list.map(cardHTML).join("");
 fitGrid(list.length,finalists);
}

function fitGrid(n, finalists=finalMode){
 if(!n)return;
 const stage=$("#stage");
 const w=Math.max(1,stage.clientWidth-10), h=Math.max(1,stage.clientHeight-10);

 if(finalists && n<=10){
   /* 10人以下は人数ごとに大きく、できるだけ画面いっぱいに */
   let cols;
   if(n===10 || n===9) cols=5;
   else if(n===8 || n===7) cols=4;
   else if(n===6 || n===5) cols=3;
   else if(n===4 || n===3) cols=2;
   else cols=1;

   const rows=Math.ceil(n/cols);
   const gap=Math.max(5,Math.min(16,w*0.01));
   const cellW=(w-(cols-1)*gap)/cols;
   const cellH=(h-(rows-1)*gap)/rows;

   grid.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
   grid.style.gridTemplateRows=`repeat(${rows},minmax(0,1fr))`;

   const imgH=Math.max(80,Math.floor(cellH*0.70));
   const numSize=Math.max(16,Math.min(34,Math.floor(Math.min(cellH,cellW)*0.12)));
   const nameSize=Math.max(17,Math.min(38,Math.floor(Math.min(cellH,cellW)*0.14)));

   grid.style.setProperty("--final-img-height",imgH+"px");
   grid.style.setProperty("--final-num-size",numSize+"px");
   grid.style.setProperty("--final-name-size",nameSize+"px");
   return;
 }

 let best={cols:1,rows:n,score:0,cellW:w,cellH:h/n};
 for(let cols=1;cols<=n;cols++){
   const rows=Math.ceil(n/cols);
   const cellW=(w-(cols-1)*3)/cols;
   const cellH=(h-(rows-1)*3)/rows;
   const score=Math.min(cellW/1.05,cellH);
   if(score>best.score) best={cols,rows,score,cellW,cellH};
 }
 grid.style.gridTemplateColumns=`repeat(${best.cols},minmax(0,1fr))`;

 if(document.body.classList.contains("recording")){
   grid.style.gridTemplateRows=`repeat(${best.rows},minmax(0,1fr))`;
   const imgH=Math.max(18,Math.floor(best.cellH*0.64));
   const numSize=Math.max(7,Math.min(14,Math.floor(best.cellH*0.13)));
   const nameSize=Math.max(7,Math.min(15,Math.floor(best.cellH*0.14)));
   grid.style.setProperty("--record-img-height",imgH+"px");
   grid.style.setProperty("--record-num-size",numSize+"px");
   grid.style.setProperty("--record-name-size",nameSize+"px");
 }else{
   grid.style.gridTemplateRows="";
   grid.style.removeProperty("--record-img-height");
   grid.style.removeProperty("--record-num-size");
   grid.style.removeProperty("--record-name-size");
 }
}

function renderPreview(){
 participants=parse().map((p,i)=>({...p,id:i}));
 finalMode=false;
 render(participants,false);
 status.textContent=participants.length?`${participants.length}名の参加者`:"参加者を入力してください";
}

function start(){
 participants=parse();
 if(participants.length<2){alert("参加者を2名以上入力してください。");return;}
 active=participants.map((p,i)=>({...p,id:i}));
 finalMode=active.length<=10;
 render(active,finalMode);
 running=true;paused=false;
 startBtn.disabled=true;$("#recordStartBtn").disabled=true;input.disabled=true;pauseBtn.disabled=false;pauseBtn.textContent="一時停止";
 const seconds=Number($("#duration").value)||12;
 const steps=Math.max(1,active.length-1);
 baseInterval=Math.max(120,(seconds*1000)/steps);

 // 残り10体になってからの9回分は、通常の5倍の間隔にする
 const slowSteps=Math.min(9,steps);
 const normalSteps=Math.max(0,steps-slowSteps);
 const now=performance.now();
 endAt=now + (normalSteps*baseInterval) + (slowSteps*baseInterval*5);
 nextAt=now + (active.length<=10 ? baseInterval*5 : baseInterval);

 status.textContent="抽選中…";
 timer=requestAnimationFrame(tick);
}

function tick(now){
 if(!running)return;
 if(paused){timer=requestAnimationFrame(tick);return;}

 const remain=Math.max(0,endAt-now);
 status.textContent=`抽選中… 残り ${(remain/1000).toFixed(1)}秒`;

 if(active.length>1 && now>=nextAt){
   eliminateOne();

   // 残り10体以下は通常の5倍ゆっくり。
   // 残り2体になったら、最後の1体が決まる瞬間だけさらに2倍（通常の10倍）遅くする。
   const multiplier=active.length===2 ? 10 : (active.length<=10 ? 5 : 1);
   nextAt=now + baseInterval*multiplier;
 }

 if(active.length===1){
   finish();
   return;
 }

 timer=requestAnimationFrame(tick);
}

function eliminateOne(immediate=false){
 if(active.length<=1)return;

 const idx=Math.floor(Math.random()*active.length);
 const victim=active[idx];
 active.splice(idx,1);

 const card=grid.querySelector(`.card[data-id="${victim.id}"]`);

 if(finalMode){
   /* 10人以下になってからは、消えるたびに残った忍者を詰め直して拡大 */
   if(card&&!immediate){
     card.classList.add("eliminating");
     setTimeout(()=>card.classList.add("gone"),220);
     setTimeout(()=>render(active,true),620);
   }else{
     render(active,true);
   }
   return;
 }

 /* 11人以上：消えたカードはDOMに残し、場所を空欄のまま保持 */
 if(card&&!immediate){
   card.classList.add("eliminating");
   setTimeout(()=>card.classList.add("gone"),260);
 }else if(card){
   card.classList.add("gone");
 }

 /* 11人→10人になった瞬間に、生存10人だけを詰めて大きく再配置 */
 if(active.length===10){
   finalMode=true;
   if(immediate){
     render(active,true);
   }else{
     setTimeout(()=>render(active,true),760);
   }
 }
}

function finish(){
 running=false;cancelAnimationFrame(timer);timer=null;
 startBtn.disabled=false;$("#recordStartBtn").disabled=false;input.disabled=false;pauseBtn.disabled=true;
 const w=active[0];
 finalMode=true;
 render(active,true);
 status.textContent=`当選者：${w.name}（${w.num}忍）`;
 winnerName.textContent=w.name;winnerNum.textContent=w.num+"忍";
 $("#closeWinner").textContent=document.body.classList.contains("recording")?"通常画面に戻る":"閉じる";
 overlay.classList.add("show");
 try{navigator.vibrate&&navigator.vibrate([120,70,180]);}catch(e){}
}

function reset(){
 running=false;paused=false;cancelAnimationFrame(timer);timer=null;
 finalMode=false;
 input.disabled=false;startBtn.disabled=false;$("#recordStartBtn").disabled=false;pauseBtn.disabled=true;pauseBtn.textContent="一時停止";
 overlay.classList.remove("show");renderPreview();
}
function togglePause(){
 if(!running)return;
 paused=!paused;
 pauseBtn.textContent=paused?"再開":"一時停止";
 status.textContent=paused?"一時停止中":"抽選中…";
}
function enterRecording(){
 document.body.classList.add("recording");
 if(running){
   if(finalMode) render(active,true);
   else fitGrid(participants.length,false);
 }else{
   renderPreview();
 }
 window.scrollTo(0,0);
 setTimeout(()=>fitGrid(finalMode?active.length:(running?participants.length:parse().length),finalMode),80);
 setTimeout(()=>fitGrid(finalMode?active.length:(running?participants.length:parse().length),finalMode),250);
}
function exitRecording(){
 document.body.classList.remove("recording");
 if(running){
   if(finalMode) render(active,true);
   else fitGrid(participants.length,false);
 }else renderPreview();
}

input.addEventListener("input",updateCount);
$("#clearBtn").onclick=()=>{input.value="";updateCount();input.focus();};
$("#sampleBtn").onclick=()=>{input.value="1,ヨッシー\n2,やまだ\n3,みらくる☆桃香\n41,オッス\n42,桜川俊信";updateCount();};
startBtn.onclick=start;
$("#recordStartBtn").onclick=start;
pauseBtn.onclick=togglePause;
resetBtn.onclick=reset;
$("#recordBtn").onclick=enterRecording;
$("#recordBackBtn").onclick=exitRecording;
$("#exitRecord").onclick=exitRecording;
$("#closeWinner").onclick=()=>{
 overlay.classList.remove("show");
 if(document.body.classList.contains("recording")) exitRecording();
};
$("#fullscreenBtn").onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){}};
window.addEventListener("resize",()=>fitGrid(finalMode?active.length:(running?participants.length:parse().length),finalMode));
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&document.body.classList.contains("recording"))exitRecording();
 if(e.code==="Space"&&running){e.preventDefault();togglePause();}
});
updateCount();
})();
</script>
